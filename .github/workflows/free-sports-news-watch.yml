name: Free Sports Headlines Watch

on:
  workflow_dispatch:
  schedule:
    - cron: '17 * * * *'

# Does not purchase odds or use a paid AI API.
# Store the latest JSON on the isolated news-watch-data branch, not on the app branch.
permissions:
  contents: write

concurrency:
  group: free-sports-headlines
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Fetch public RSS signals (no paid API)
        run: python3 scripts/news_watch.py
      - name: Validate JSON before publishing
        run: python3 scripts/validate_news_watch.py public/news-watch.json
      - name: Preserve diagnostic artifact
        uses: actions/upload-artifact@v4
        with:
          name: news-watch-${{ github.run_id }}
          path: public/news-watch.json
          retention-days: 2
          if-no-files-found: error
      - name: Publish latest JSON to isolated branch
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          git config --global user.name "svl-news-watch[bot]"
          git config --global user.email "svl-news-watch[bot]@users.noreply.github.com"
          mkdir -p /tmp/svl-news-data
          cp public/news-watch.json /tmp/svl-news-data/news-watch.json
          git clone --quiet --depth 1 --branch news-watch-data \
            "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" /tmp/svl-news-data/repo
          cd /tmp/svl-news-data/repo
          cp ../news-watch.json news-watch.json
          git add news-watch.json
          if git diff --cached --quiet; then
            echo "No update needed"
          else
            git commit -m "News headlines watch update $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            git push origin HEAD:news-watch-data
          fi
