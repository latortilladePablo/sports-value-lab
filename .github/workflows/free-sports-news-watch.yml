name: Free Sports Headlines Watch

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/free-sports-news-watch.yml'
  workflow_dispatch:
  schedule:
    - cron: '17 * * * *'

# Does not purchase odds or use a paid AI API.
# Store the latest JSON on the isolated news-watch-data branch, not on the app branch.
permissions:
  contents: write

concurrency:
  group: free-sports-headlines
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Fetch public RSS signals (no paid API)
        run: python3 scripts/news_watch.py
      - name: Validate JSON before publishing
        run: python3 scripts/validate_news_watch.py public/news-watch.json
      - name: Publish latest JSON to isolated data branch
        uses: actions/github-script@v7
        with:
          github-token: ${{ github.token }}
          script: |
            const fs = require('fs');
            const content = fs.readFileSync('public/news-watch.json', 'utf8');
            const {owner, repo} = context.repo;
            const path = 'news-watch.json';
            const branch = 'news-watch-data';
            const old = await github.rest.repos.getContent({owner, repo, path, ref: branch});
            await github.rest.repos.createOrUpdateFileContents({
              owner, repo, path, branch,
              message: 'Update free sports headlines snapshot',
              content: Buffer.from(content, 'utf8').toString('base64'),
              sha: old.data.sha
            });
