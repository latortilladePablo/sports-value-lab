name: SVL Temporary GitHub Token Write Probe
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/svl-temporary-write-probe.yml'
permissions:
  contents: write
jobs:
  probe:
    if: github.repository == 'latortilladePablo/sports-value-lab'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Test isolated JSON branch write
        uses: actions/github-script@v7
        with:
          script: |
            const {owner,repo}=context.repo;
            const branch='news-watch-data';
            const path='token-write-probe.json';
            const content=JSON.stringify({probe:true,created_at:new Date().toISOString(),run_id:context.runId,not_news:true},null,2);
            await github.rest.repos.createOrUpdateFileContents({
              owner,repo,path,branch,message:'Temporary GITHUB_TOKEN write probe',
              content:Buffer.from(content).toString('base64')
            });
