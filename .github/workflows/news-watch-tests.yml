name: Free News Watch Tests

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'scripts/news_watch.py'
      - 'tests/test_news_watch.py'
      - '.github/workflows/free-sports-news-watch.yml'
      - '.github/workflows/news-watch-tests.yml'

permissions:
  contents: read

jobs:
  offline-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Compile and unit tests without network or paid APIs
        run: |
          python3 -m py_compile scripts/news_watch.py
          python3 -m unittest discover -s tests -p 'test_news_watch.py' -v
